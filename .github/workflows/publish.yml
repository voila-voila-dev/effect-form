name: Publish

# Publishes both packages to public npm at the version already committed in
# their manifests. Bump `version` in packages/*/package.json (and the exact
# `@voila.dev/effect-form` pin in the react package) in the same commit, then
# run this.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate without publishing"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  # Required for npm Trusted Publishing (OIDC).
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Third-party action, so pinned to a SHA rather than a moving tag.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Biome
        run: bun run ci

      # `test` builds first, so this leaves the dist/ the exports point at.
      - name: Test
        run: bun run test

      # bun packs and npm publishes, because each does one half of the job:
      # bun is what resolves the manifests' `catalog:` refs into concrete
      # versions, and npm is what speaks npm's OIDC trusted publishing.
      #
      # A token cannot publish from a runner: npm answers a token publish with
      # a 2FA challenge, and `bun publish` turns that into its `web` auth flow,
      # which is a login URL nobody can click. OIDC has no such challenge.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pack
        run: |
          cd packages/form && bun pm pack --destination "${RUNNER_TEMP}"
          cd ../form-react && bun pm pack --destination "${RUNNER_TEMP}"

      # The core goes first: the react package pins it exactly, so publishing
      # them the other way round leaves a window where the react tarball
      # resolves to nothing.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          npm publish "${RUNNER_TEMP}"/voila.dev-effect-form-[0-9]*.tgz --access public
          npm publish "${RUNNER_TEMP}"/voila.dev-effect-form-react-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
