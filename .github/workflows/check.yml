name: Check

# `main` is covered by the Main workflow, which runs the same checks before it
# publishes, so this one only guards the way in.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Third-party action, so pinned to a SHA rather than a moving tag.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Frozen: a lockfile that no longer matches package.json fails the job
      # instead of silently resolving something else than what we publish.
      - run: bun install --frozen-lockfile

      - name: Biome
        run: bun run ci

      # Builds the packages and typechecks the tests in one pass: the root
      # solution references both, and dist/ is what actually ships.
      - name: Typecheck and build
        run: bun run build

      - name: Test
        run: bun run test

  audit:
    name: Dead code and complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `fallow audit` diffs against the base commit to tell an introduced
          # finding from one this fork inherited, so it needs the history.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Gates on what the changeset introduces; the committed baselines in
      # .fallow-baselines/ keep the inherited findings out of the verdict.
      - name: Run fallow audit
        run: bunx fallow audit --base "origin/${{ github.base_ref || github.event.repository.default_branch }}" --quiet
